services:
  db:
    image: postgres:16-alpine
    container_name: autodetalha-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-autodetalha}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - autodetalha-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-autodetalha}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  autodetalha-db-data:
